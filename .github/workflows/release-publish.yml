name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python (from pyproject)
        uses: actions/setup-python@v6
        with:
          python-version-file: pyproject.toml

      - name: Install uv (with cache)
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Read tag and version from lalamo/__init__.py
        id: meta
        shell: bash
        run: |
          echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          cur=$(sed -nE 's/^__version__[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' lalamo/__init__.py | head -n1)
          if [ -z "$cur" ]; then
            echo "Could not read current version from lalamo/__init__.py"
            exit 1
          fi
          echo "version=${cur}" >> "$GITHUB_OUTPUT"

      - name: Verify tag equals __version__
        shell: bash
        run: |
          tag="${{ steps.meta.outputs.tag }}"
          ver="${{ steps.meta.outputs.version }}"
          tag_stripped="${tag#v}"
          if [ "$tag_stripped" != "$ver" ]; then
            echo "Tag ($tag) does not match package version ($ver)"
            exit 1
          fi
          echo "Tag ($tag) matches package version ($ver)"

      - name: Build distributions (uv build)
        run: uv build --no-sources

      - name: Check distributions (twine check)
        run: uv run twine check dist/*

      - name: Publish to PyPI (uv publish)
        run: uv publish

  notify-release:
    name: Announce release on Discord
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Send release notification
        env:
          DISCORD_WEBHOOK_URL: ${{ vars.DISCORD_RELEASE_CHANNEL_WEBHOOK_URL }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_URL: ${{ github.event.release.html_url }}
        run: |
          set -euo pipefail
          : "${DISCORD_WEBHOOK_URL:?DISCORD_RELEASE_CHANNEL_WEBHOOK_URL variable is required}"
          echo "::add-mask::$DISCORD_WEBHOOK_URL"

          jq -n --arg tag "$RELEASE_TAG" --arg url "$RELEASE_URL" \
            '{allowed_mentions: {parse: []}, content: "📦 **[lalamo · \($tag)](<\($url)>)**"}' |
          curl --fail-with-body --silent --show-error \
            --connect-timeout 10 --max-time 30 \
            --header "Content-Type: application/json" \
            --data-binary @- \
            --url-query "wait=true" \
            "$DISCORD_WEBHOOK_URL" > /dev/null
